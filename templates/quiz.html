{% extends "base.html" %}

{% block title %}
AI Quiz - GameVerse
{% endblock %}

{% block content %}

<div class="quiz-container">

    <div class="quiz-header">

        <div>
            <div class="badge">
                🤖 AI ADAPTIVE QUIZ
            </div>

            <h1>Challenge Yourself 🎯</h1>
        </div>

        <div class="timer">
            ⏱️ <span id="timer">30</span>s
        </div>

    </div>


    <div class="quiz-info">

        <div>
            Question
            <strong id="question-number">1 / 25</strong>
        </div>

        <div>
            Difficulty
            <strong id="difficulty">Easy</strong>
        </div>

        <div>
            Score
            <strong id="score">0</strong>
        </div>

    </div>


    <div class="question-card">

        <h2 id="question"></h2>

        <div class="options">

            <button
                class="option"
                onclick="checkAnswer(this, 0)">
            </button>

            <button
                class="option"
                onclick="checkAnswer(this, 1)">
            </button>

            <button
                class="option"
                onclick="checkAnswer(this, 2)">
            </button>

            <button
                class="option"
                onclick="checkAnswer(this, 3)">
            </button>

        </div>


        <button
            id="next-button"
            class="btn"
            onclick="nextQuestion()"
            style="display:none;">

            Next Question →

        </button>

    </div>


    <div class="quiz-footer">

        <div>
            🪙 Coins:
            <strong id="coins">0</strong>
        </div>

        <div>
            ⚡ XP:
            <strong id="xp">0</strong>
        </div>

    </div>

</div>


<script>

/* =====================================================
   QUESTION BANK
===================================================== */

const questions = [

    /* ================= EASY ================= */

    {
        question: "Which language is mainly used for Machine Learning?",
        options: ["Python", "HTML", "CSS", "SQL"],
        answer: 0,
        difficulty: "Easy"
    },

    {
        question: "What does AI stand for?",

            "Artificial Intelligence",
            "Automatic Internet",
            "Advanced Information",
            "Artificial Internet"
        ],
        answer: 0,
        difficulty: "Easy"
    },

    {
        question: "Which data type stores True or False?",
        options: [
            "Integer",
            "Boolean",
            "String",
            "Float"
        ],
        answer: 1,
        difficulty: "Easy"
    },

    {
        question: "Which symbol is used for comments in Python?",
        options: [
            "//",
            "/* */",
            "#",
            "<!-- -->"
        ],
        answer: 2,
        difficulty: "Easy"
    },

    {
        question: "Which library is commonly used for data analysis in Python?",
        options: [
            "Pandas",
            "Flask",
            "Tkinter",
            "Requests"
        ],
        answer: 0,
        difficulty: "Easy"
    },

    {
        question: "Which algorithm is used for classification?",
        options: [
            "Decision Tree",
            "Bubble Sort",
            "Binary Search",
            "Merge Sort"
        ],
        answer: 0,

    },

    {
        question: "What is the full form of SQL?",
        options: [
            "Structured Query Language",

            "System Query Logic",
            "Structured Question List"
        ],
        answer: 0,
        difficulty: "Easy"
    },

    {
        question: "Which database is used in this GameVerse project?",
        options: [
            "MongoDB",
            "SQLite",
            "Oracle",
            "Redis"
        ],
        answer: 1,
        difficulty: "Easy"
    },

    {
        question: "Which keyword is used to define a function in Python?",
        options: [
            "function",
            "define",
            "def",
            "fun"
        ],
        answer: 2,
        difficulty: "Easy"
    },

    {
        question: "Which technology is used to create the structure of a web page?",
        options: [
            "HTML",
            "CSS",
            "Python",
            "SQL"
        ],
        answer: 0,
        difficulty: "Easy"
    },


    /* ================= MEDIUM ================= */

    {
        question: "Which algorithm finds the shortest path in a weighted graph?",
        options: [
            "Dijkstra's Algorithm",
            "DFS",
            "BFS",
            "Linear Search"
        ],
        answer: 0,
        difficulty: "Medium"
    },

    {
        question: "Which data structure follows FIFO?",
        options: [
            "Stack",
            "Queue",
            "Tree",
            "Graph"
        ],
        answer: 1,
        difficulty: "Medium"
    },

    {
        question: "Which data structure follows LIFO?",
        options: [
            "Queue",
            "Array",
            "Stack",
            "Graph"
        ],
        answer: 2,
        difficulty: "Medium"
    },

    {
        question: "Which traversal uses a queue?",
        options: [
            "DFS",
            "BFS",
            "Inorder",
            "Postorder"
        ],
        answer: 1,
        difficulty: "Medium"
    },

    {
        question: "Which SQL clause is used to filter groups?",
        options: [
            "WHERE",
            "ORDER BY",
            "HAVING",
            "SELECT"
        ],
        answer: 2,
        difficulty: "Medium"
    },

    {
        question: "What is the main purpose of normalization in DBMS?",
        options: [
            "Increase duplicate data",
            "Reduce data redundancy",
            "Delete all tables",
            "Increase storage"
        ],
        answer: 1,
        difficulty: "Medium"
    },

    {
        question: "Which technique is used to prevent overfitting?",
        options: [
            "Regularization",
            "Duplication",
            "Compilation",
            "Indexing"
        ],
        answer: 0,
        difficulty: "Medium"
    },

    {
        question: "What does CNN mainly work with?",
        options: [
            "Images",
            "Only databases",
            "Only text files",
            "SQL queries"
        ],
        answer: 0,
        difficulty: "Medium"
    },

    {
        question: "Which method is used to split data into training and testing sets?",
        options: [
            "train_test_split",
            "data_join",
            "data_merge",
            "test_train_only"
        ],
        answer: 0,
        difficulty: "Medium"
    },

    {
        question: "Which metric measures the proportion of correct predictions?",
        options: [
            "Accuracy",
            "Latency",
            "Memory",
            "Frequency"
        ],
        answer: 0,
        difficulty: "Medium"
    },


    /* ================= HARD ================= */

    {
        question: "In a Binary Search Tree, values smaller than a node are generally placed where?",
        options: [
            "Right subtree",
            "Left subtree",
            "Root only",
            "Outside the tree"
        ],
        answer: 1,
        difficulty: "Hard"
    },

    {
        question: "Which algorithm is commonly used to find a Minimum Spanning Tree?",
        options: [
            "Kruskal's Algorithm",
            "Binary Search",
            "Linear Search",
            "Floyd's Sorting"
        ],
        answer: 0,
        difficulty: "Hard"
    },

    {
        question: "What does overfitting mean in Machine Learning?",
        options: [
            "Model performs well only on training data",
            "Model has no training data",
            "Model always predicts randomly",
            "Model cannot learn anything"
        ],
        answer: 0,
        difficulty: "Hard"
    },

    {
        question: "Which activation function is commonly used in hidden layers of neural networks?",
        options: [
            "ReLU",
            "SQL",
            "HTML",
            "CSV"
        ],
        answer: 0,
        difficulty: "Hard"
    },

    {
        question: "What is the purpose of Alpha-Beta pruning in Minimax?",
        options: [
            "Reduce unnecessary game-tree search",
            "Increase database size",
            "Sort an array",
            "Create a neural network"
        ],
        answer: 0,
        difficulty: "Hard"
    }

];


/* =====================================================
   GAME VARIABLES
===================================================== */

let currentQuestion = 0;

let score = 0;

let xp = 0;

let coins = 0;

let correctAnswers = 0;

let wrongAnswers = 0;

let time = 30;

let answered = false;

let timer;


/*
   Adaptive difficulty starts at Easy.
*/
let currentDifficulty = "Easy";


/*
   Questions already used.
*/
let usedQuestions = [];


/* =====================================================
   GET QUESTIONS BY DIFFICULTY
===================================================== */

function getQuestionsByDifficulty(difficulty) {

    return questions.filter(function(q) {

        return (
            q.difficulty === difficulty &&
            !usedQuestions.includes(q)
        );

    });

}


/* =====================================================
   ADAPTIVE ENGINE
===================================================== */

function chooseDifficulty() {

    /*
       First question always starts Easy.
    */

    if (currentQuestion === 0) {

        return "Easy";

    }


    /*
       If last 2 answers were correct,
       move upward.
    */

    if (
        correctAnswers >= 2 &&
        correctAnswers > wrongAnswers
    ) {

        if (currentDifficulty === "Easy") {

            return "Medium";

        }

        if (currentDifficulty === "Medium") {

            return "Hard";

        }

        return "Hard";

    }


    /*
       If wrong answers are more,
       move downward.
    */

    if (wrongAnswers > correctAnswers) {

        if (currentDifficulty === "Hard") {

            return "Medium";

        }

        if (currentDifficulty === "Medium") {

            return "Easy";

        }

        return "Easy";

    }


    return currentDifficulty;

}


/* =====================================================
   SELECT NEXT QUESTION
===================================================== */

function selectNextQuestion() {

    let difficulty = chooseDifficulty();


    let available =
        getQuestionsByDifficulty(difficulty);


    /*
       If that difficulty has no unused questions,
       try another difficulty.
    */

    if (available.length === 0) {

        available =
            getQuestionsByDifficulty("Medium");

    }


    if (available.length === 0) {

        available =
            getQuestionsByDifficulty("Easy");

    }


    if (available.length === 0) {

        available =
            getQuestionsByDifficulty("Hard");

    }


    /*
       Random question from available questions.
    */

    const randomIndex =
        Math.floor(
            Math.random() * available.length
        );


    const selectedQuestion =
        available[randomIndex];


    usedQuestions.push(selectedQuestion);


    currentDifficulty =
        selectedQuestion.difficulty;


    return selectedQuestion;

}


/* =====================================================
   LOAD QUESTION
===================================================== */

function loadQuestion() {

    clearInterval(timer);

    answered = false;

    time = 30;


    document.getElementById("timer").innerText =
        time;


    const q =
        selectNextQuestion();


    document.getElementById("question-number").innerText =
        (currentQuestion + 1) + " / 25";


    document.getElementById("question").innerText =
        q.question;


    document.getElementById("difficulty").innerText =
        q.difficulty;


    const buttons =
        document.querySelectorAll(".option");


    buttons.forEach(function(button, index) {

        button.innerText =
            q.options[index];

        button.disabled = false;

        button.style.border = "";

        button.style.opacity = "1";

    });


    document.getElementById("next-button")
        .style.display = "none";


    startTimer();

}


/* =====================================================
   TIMER
===================================================== */

function startTimer() {

    timer = setInterval(function() {

        time--;

        document.getElementById("timer").innerText =
            time;


        if (time <= 0) {

            clearInterval(timer);

            answered = true;

            wrongAnswers++;


            const buttons =
                document.querySelectorAll(".option");


            buttons.forEach(function(button) {

                button.disabled = true;

            });


            alert("Time's up! ⏰");


            document.getElementById("next-button")
                .style.display = "inline-block";

        }

    }, 1000);

}


/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer(button, selectedAnswer) {

    if (answered) {

        return;

    }


    answered = true;

    clearInterval(timer);


    /*
       Get current question from usedQuestions.
    */

    const q =
        usedQuestions[currentQuestion];


    const correctAnswer =
        q.answer;


    const buttons =
        document.querySelectorAll(".option");


    buttons.forEach(function(btn) {

        btn.disabled = true;

    });


    if (selectedAnswer === correctAnswer) {

        correctAnswers++;

        score += 10;

        xp += 20;

        coins += 5;


        document.getElementById("score").innerText =
            score;


        document.getElementById("xp").innerText =
            xp;


        document.getElementById("coins").innerText =
            coins;


        button.style.border =
            "3px solid #00ff88";


        alert(
            "Correct! 🎉\n\n" +
            "+10 Score\n" +
            "+20 XP\n" +
            "+5 Coins"
        );


    } else {

        wrongAnswers++;


        button.style.border =
            "3px solid red";


        buttons[correctAnswer].style.border =
            "3px solid #00ff88";


        alert(
            "Wrong answer! ❌"
        );

    }


    /*
       Show what difficulty the NEXT
       question may have.
    */

    document.getElementById("difficulty").innerText =
        chooseDifficulty();


    document.getElementById("next-button")
        .style.display = "inline-block";

}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion() {

    currentQuestion++;


    if (currentQuestion >= 25) {

        finishQuiz();

        return;

    }


    loadQuestion();

}


/* =====================================================
   FINISH QUIZ
===================================================== */

function finishQuiz() {

    clearInterval(timer);


    fetch("/save_result", {

        method: "POST",

        headers: {

            "Content-Type": "application/json"

        },

        body: JSON.stringify({

            score: score,

            xp: xp,

            coins: coins,

            correct: correctAnswers,

            wrong: wrongAnswers

        })

    })


    .then(function(response) {

        return response.json();

    })


    .then(function(data) {

        if (!data.success) {

            alert(
                "Unable to save result."
            );

            return;

        }


        let level;


        if (data.level >= 5) {

            level = "🏆 Expert";

        }

        else if (data.level >= 3) {

            level = "🔥 Advanced";

        }

        else if (data.level >= 2) {

            level = "⭐ Intermediate";

        }

        else {

            level = "🎮 Beginner";

        }


        const accuracy =
            Math.round(
                (correctAnswers / 25) * 100
            );


        document.querySelector(".quiz-container")
            .innerHTML = `

            <div class="question-card">

                <div class="badge">
                    🏆 QUIZ COMPLETED
                </div>

                <h1>
                    Great Job! 🎉
                </h1>

                <h2>
                    Your Final Result
                </h2>

                <p>
                    You completed all 25 questions!
                </p>


                <div class="stats">

                    <div class="stat-card">

                        <h3>⭐ Score</h3>

                        <h2>${score}</h2>

                        <p>
                            This Quiz
                        </p>

                    </div>


                    <div class="stat-card">

                        <h3>⚡ XP</h3>

                        <h2>${xp}</h2>

                        <p>
                            Experience Points
                        </p>

                    </div>


                    <div class="stat-card">

                        <h3>🪙 Coins</h3>

                        <h2>${coins}</h2>

                        <p>
                            Game Coins
                        </p>

                    </div>


                    <div class="stat-card">

                        <h3>🎮 Level</h3>

                        <h2>${data.level}</h2>

                        <p>
                            ${level}
                        </p>

                    </div>

                </div>


                <p>

                    ✅ Correct Answers:
                    <strong>
                        ${correctAnswers}
                    </strong>

                    <br><br>

                    ❌ Wrong Answers:
                    <strong>
                        ${wrongAnswers}
                    </strong>

                    <br><br>

                    📊 Accuracy:
                    <strong>
                        ${accuracy}%
                    </strong>

                    <br><br>

                    🤖 Next Difficulty:
                    <strong>
                        ${data.difficulty}
                    </strong>

                </p>


                <a
                    href="/dashboard"
                    class="btn">

                    Back to Dashboard

                </a>


                <button
                    class="btn"
                    onclick="location.reload()">

                    🔄 Play Again

                </button>

            </div>

        `;

    })


    .catch(function(error) {

        console.log(error);

        alert(
            "Something went wrong while saving the result."
        );

    });

}


/* =====================================================
   START QUIZ
===================================================== */

loadQuestion();

</script>

{% endblock %}
