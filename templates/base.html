<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        GameVerse
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<nav>

    <div class="logo">
        🎮 GameVerse
    </div>


    <div>

        <a href="/">
            Home
        </a>


        {% if session.get("user_id") %}

        <a href="/dashboard">
            Dashboard
        </a>

        <a href="/leaderboard">
            Leaderboard
        </a>

        <a href="/profile">
            Profile
        </a>

        <a href="/logout">
            Logout
        </a>

        {% else %}

        <a href="/login">
            Login
        </a>

        <a href="/register">
            Register
        </a>

        {% endif %}

    </div>

</nav>


<main>

    {% block content %}
    {% endblock %}

</main>


</body>

</html>
